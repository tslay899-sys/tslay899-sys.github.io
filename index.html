<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="记录每天的学习、思考与下一步行动。">
  <meta name="color-scheme" content="light dark">
  <title>行而不辍｜学习日志</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#logs">跳到学习记录</a>

  <header class="site-header">
    <nav class="nav shell" aria-label="主导航">
      <a class="brand" href="./" aria-label="返回首页">
        <span class="brand-mark" aria-hidden="true">行</span>
        <span>学习日志</span>
      </a>
      <button class="theme-button" id="theme-button" type="button" aria-label="切换明暗主题">
        <span aria-hidden="true" id="theme-icon">◐</span>
        <span class="theme-label">切换主题</span>
      </button>
    </nav>

    <div class="hero shell">
      <p class="eyebrow">DAILY LEARNING JOURNAL</p>
      <h1>行而不辍，<span>未来可期。</span></h1>
      <p class="hero-copy">把每天学到的东西留下来，让微小的进步清晰可见。</p>
      <div class="hero-meta" aria-label="日志概览">
        <div><strong id="total-count">0</strong><span>篇记录</span></div>
        <div><strong id="streak-count">0</strong><span>天连续记录</span></div>
        <div><strong id="latest-date">—</strong><span>最近更新</span></div>
      </div>
    </div>
  </header>

  <main class="shell page-layout">
    <aside class="side-panel" aria-label="日志筛选">
      <div class="panel-heading">
        <p class="eyebrow">ARCHIVE</p>
        <h2>学习档案</h2>
      </div>
      <label class="search-box" for="search-input">
        <span aria-hidden="true">⌕</span>
        <input id="search-input" type="search" placeholder="搜索内容或标签" autocomplete="off">
      </label>
      <div class="filter-group">
        <p>按标签浏览</p>
        <div class="tag-filters" id="tag-filters"></div>
      </div>
      <p class="side-note">持续记录，比偶尔完美更重要。</p>
    </aside>

    <section class="log-section" id="logs" aria-labelledby="logs-title">
      <div class="section-heading">
        <div>
          <p class="eyebrow">LATEST NOTES</p>
          <h2 id="logs-title">最近记录</h2>
        </div>
        <p id="result-count" aria-live="polite"></p>
      </div>

      <div class="timeline" id="log-container"></div>
      <div class="empty-state" id="empty-state" hidden>
        <span aria-hidden="true">⌕</span>
        <h3>没有找到相关记录</h3>
        <p>换一个关键词或标签试试。</p>
      </div>
    </section>
  </main>

  <footer class="site-footer shell">
    <p>每天进步一点点。</p>
    <p>© <span id="current-year"></span> 学习日志</p>
  </footer>

  <script src="data/logs.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
